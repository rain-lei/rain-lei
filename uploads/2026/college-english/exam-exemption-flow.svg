<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">大学英语以考代修判断流程</title>
  <desc id="desc">根据雅思托福成绩或本校四六级成绩判断可申请免修的课程、认定成绩以及申请限制。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#171717"/></marker>
    <style>.t{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#171717}.box{stroke:#171717;stroke-width:3}.line{fill:none;stroke:#171717;stroke-width:4;marker-end:url(#arrow)}.head{font-size:26px;font-weight:800}.body{font-size:18px}.mono{font-family:Consolas,monospace;letter-spacing:2px}</style>
  </defs>
  <rect width="1200" height="780" fill="#f6f3eb"/>
  <path d="M0 0H1200V16H0Z" fill="#d8ff67"/>
  <text class="t mono" x="62" y="72" font-size="18">EXAM EXEMPTION / 03</text>
  <text class="t" x="62" y="126" font-size="43" font-weight="800">我能申请“以考代修”吗？</text>

  <rect class="box" x="428" y="168" width="344" height="78" rx="20" fill="#171717"/>
  <text x="600" y="216" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="27" font-weight="800" fill="#fff">手上已有哪类考试成绩？</text>
  <path class="line" d="M510 246V292H300"/>
  <path class="line" d="M690 246V292H900"/>

  <rect class="box" x="62" y="292" width="476" height="74" rx="18" fill="#8db5ff"/>
  <text class="t head" x="300" y="339" text-anchor="middle">雅思 / 托福：成绩取得后 6 个月内</text>

  <rect class="box" x="662" y="292" width="476" height="74" rx="18" fill="#ffd36a"/>
  <text class="t head" x="900" y="339" text-anchor="middle">本校参加的大学英语四 / 六级</text>

  <rect class="box" x="62" y="397" width="476" height="218" rx="20" fill="#ffffff"/>
  <text class="t body" x="92" y="441">雅思 6 / 托福 75—83</text>
  <text class="t" x="508" y="441" text-anchor="end" font-size="19" font-weight="800">大英 1—2 · 95 分</text>
  <line x1="92" y1="462" x2="508" y2="462" stroke="#c8c5bd" stroke-width="2"/>
  <text class="t body" x="92" y="505">雅思 6.5 / 托福 84—93</text>
  <text class="t" x="508" y="505" text-anchor="end" font-size="19" font-weight="800">大英 1—3 · 97 分</text>
  <line x1="92" y1="526" x2="508" y2="526" stroke="#c8c5bd" stroke-width="2"/>
  <text class="t body" x="92" y="569">雅思 7 / 托福 94+</text>
  <text class="t" x="508" y="569" text-anchor="end" font-size="19" font-weight="800">大英 1—4 · 99 分</text>

  <rect class="box" x="662" y="397" width="476" height="218" rx="20" fill="#ffffff"/>
  <text class="t" x="692" y="438" font-size="19" font-weight="800">申请大学英语 2</text>
  <text class="t body" x="692" y="472">四级 580+ / 六级 550+</text>
  <text class="t body" x="692" y="501">且口试达到“良好”及以上</text>
  <line x1="692" y1="524" x2="1108" y2="524" stroke="#c8c5bd" stroke-width="2"/>
  <text class="t" x="692" y="562" font-size="19" font-weight="800">申请大学英语 3 或 4</text>
  <text class="t body" x="692" y="594">四级 600+ / 六级 580+，且口试良好+</text>

  <path class="line" d="M300 615V662H462"/>
  <path class="line" d="M900 615V662H738"/>
  <rect class="box" x="356" y="662" width="488" height="72" rx="20" fill="#4f5cff"/>
  <text x="600" y="692" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="800" fill="#fff">准备材料并按流程申请</text>
  <text x="600" y="719" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#fff">四六级路线：先选课 · 只用一次 · 只限相邻学期 · 课程认定 98 分</text>

  <text class="t body" x="62" y="760">未达到门槛：按正常课程路径学习，不影响后续再次参加考试。</text>
</svg>
